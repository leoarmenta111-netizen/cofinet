name: cofinet-qa

services:
  backend:
    env_file:
      - .env.qa

  db-init:
    env_file:
      - .env.qa

  db-migrate:
    env_file:
      - .env.qa

  nginx:
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8081}:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
