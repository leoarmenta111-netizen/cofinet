<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Dashboard | CofiNet+</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="auth-pending" data-page="dashboard">
    <div class="app-shell protected-content">
        <aside class="sidebar">
            <div class="brand-lockup"><span class="brand-mark">C</span><span>CofiNet+</span></div>
            <nav data-admin-nav aria-label="Navegación principal"></nav>
            <div class="sidebar-profile">
                <div class="profile-row"><span class="avatar" data-admin-initials></span><div class="profile-copy"><strong data-admin-name></strong><span data-admin-role></span></div></div>
                <button class="button button-ghost logout-button" type="button" onclick="CofiAdmin.logoutAdmin()">Cerrar sesión</button>
            </div>
        </aside>
        <div class="main-area">
            <header class="topbar"><button class="button button-ghost menu-toggle" data-menu-toggle aria-expanded="false" aria-label="Abrir menú">Menú</button><span class="topbar-title">Resumen operativo</span><span class="muted" data-admin-name></span></header>
            <main class="content">
                <header class="page-header"><div><p class="eyebrow">Vista general</p><h1 class="page-title">Dashboard</h1><p class="page-description">Indicadores reales de ventas, accesos y pagos registrados en CofiNet.</p></div></header>
                <div id="dashboard-loading" class="metrics-grid" aria-label="Cargando indicadores"><div class="skeleton metric-card"></div><div class="skeleton metric-card"></div><div class="skeleton metric-card"></div><div class="skeleton metric-card"></div></div>
                <section id="metrics" class="metrics-grid" hidden aria-label="Indicadores"></section>
            </main>
        </div>
    </div>
    <script src="admin.js"></script>
    <script>
(() => {

        const { SUPER_ADMIN, adminRequest, bootstrapAdmin, formatMoney, showToast } = window.CofiAdmin;
        const metrics = [
            ["total_sales_today", "Ventas de hoy", true, "Desde las 00:00"],
            ["total_sales_week", "Ventas esta semana", true, "Desde el lunes"],
            ["total_sales_month", "Ventas este mes", true, "Mes calendario"],
            ["active_purchases", "Compras activas", false, "Acceso vigente"],
            ["expired_purchases", "Compras expiradas", false, "Histórico registrado"],
            ["active_pins", "PINs activos", false, "Con vigencia actual"],
            ["pending_mercadopago_payments", "Pagos pendientes", false, "Mercado Pago"]
        ];

        (async () => {
            const admin = await bootstrapAdmin({ allowedRoles: [SUPER_ADMIN] });
            if (!admin) return;
            try {
                const dashboard = await adminRequest("/admin/dashboard");
                const container = document.getElementById("metrics");
                for (const [key, label, money, foot] of metrics) {
                    const card = document.createElement("article");
                    card.className = `metric-card ${money ? "metric-wide" : ""}`;
                    const title = document.createElement("span"); title.className = "metric-label"; title.textContent = label;
                    const value = document.createElement("strong"); value.className = "metric-value"; value.textContent = money ? formatMoney(dashboard[key]) : dashboard[key];
                    const note = document.createElement("small"); note.className = "metric-foot"; note.textContent = foot;
                    card.append(title, value, note); container.append(card);
                }
                container.hidden = false;
            } catch (error) {
                showToast(error.message, "error");
            } finally {
                document.getElementById("dashboard-loading")?.remove();
            }
        })();

})();
</script>
</body>
</html>
