name: cofinet

services:
  backend:
    container_name: cofinet-api
    env_file:
      - ./backend/.env

  db-init:
    env_file:
      - ./backend/.env

  db-migrate:
    env_file:
      - ./backend/.env

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:?Set POSTGRES_VOLUME_NAME to the verified existing production volume}
    external: true
