name: cofinet

services:
  backend:
    container_name: cofinet-api
    env_file:
      - ./backend/.env
    volumes:
      - /opt/cofinet-data/pos-product-images:/data/pos-product-images

  db-init:
    env_file:
      - ./backend/.env

  db-migrate:
    env_file:
      - ./backend/.env

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/pos-ssl.conf:/etc/nginx/conf.d/pos-ssl.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/cofinet-data/pos-product-images:/usr/share/nginx/pos-product-images:ro

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:?Set POSTGRES_VOLUME_NAME to the verified existing production volume}
    external: true
