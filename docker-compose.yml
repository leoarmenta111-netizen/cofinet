# Shared service definitions. Always combine this file with exactly one
# environment overlay: docker-compose.dev.yml, .qa.yml, or .prod.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - database
    restart: unless-stopped
    stop_grace_period: 30s

  backend:
    build:
      context: ./backend
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - application
      - database
    restart: unless-stopped
    init: true

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./admin:/usr/share/nginx/admin:ro
      - ./pos:/usr/share/nginx/pos:ro
      - ./customer-order:/usr/share/nginx/customer-order:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - application
    restart: unless-stopped

  # Explicit maintenance job; never runs during a normal `up`.
  db-init:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    command: ["python", "-m", "app.database.init_db"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    restart: "no"

  db-migrate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: runtime
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    restart: "no"

volumes:
  postgres_data:

networks:
  application:
  database:
    internal: true
