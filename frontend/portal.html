<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F0F10">
    <title>CoFiNet | Activar Internet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cofiDark: "#0F0F10",
                        cofiCard: "#161616",
                        cofiOlive: "#A3A375",
                        cofiOliveHover: "#BBB68D"
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        outfit: ["Outfit", "sans-serif"]
                    }
                }
            }
        };
    </script>
    <style>
        .portal-spinner { animation: portal-spin .7s linear infinite; }
        .pin-box {
            width: clamp(2.6rem, 11vw, 3.5rem);
            height: clamp(3.4rem, 15vw, 4.25rem);
            border: 1px solid #3f3f46;
            border-radius: 0.9rem;
            background: #0F0F10;
            color: #FFFFFF;
            font-family: Outfit, sans-serif;
            font-size: clamp(1.4rem, 6vw, 2rem);
            font-weight: 700;
            line-height: 1;
            text-align: center;
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .pin-box:focus {
            border-color: #A3A375;
            box-shadow: 0 0 0 3px rgba(163, 163, 117, .2);
        }
        @keyframes portal-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen bg-cofiDark font-sans text-white antialiased">
    <main class="flex min-h-screen items-center justify-center px-4 py-10 sm:px-6">
        <section class="w-full max-w-md rounded-[28px] border border-zinc-800 bg-cofiCard p-6 shadow-2xl shadow-black/30 sm:p-9">
            <header class="mb-9 text-center">
                <p class="font-outfit text-3xl font-extrabold tracking-[0.16em] text-cofiOlive">COFINET</p>
                <div class="mx-auto mt-4 h-px w-12 bg-cofiOlive/60"></div>
                <h1 class="mt-5 font-outfit text-2xl font-bold leading-tight text-white">Ingresa tu PIN de acceso a Internet</h1>
                <p class="mt-2 text-sm leading-6 text-zinc-400">Conéctate de forma segura a la red CoFiNet.</p>
            </header>

            <form id="pin-form" novalidate>
                <fieldset>
                    <legend class="sr-only">PIN de acceso de 6 dígitos</legend>
                    <div id="pin-boxes" class="flex justify-center gap-2 sm:gap-3" aria-describedby="pin-hint">
                        <input class="pin-box" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Dígito 1 del PIN">
                        <input class="pin-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 2 del PIN">
                        <input class="pin-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 3 del PIN">
                        <input class="pin-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 4 del PIN">
                        <input class="pin-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 5 del PIN">
                        <input class="pin-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 6 del PIN">
                    </div>
                    <p id="pin-hint" class="mt-4 text-center text-xs text-zinc-500">Ingresa los 6 dígitos de tu código de acceso.</p>
                </fieldset>

                <button id="connect-button" type="submit" class="mt-7 flex w-full items-center justify-center gap-3 rounded-2xl bg-cofiOlive px-5 py-4 text-sm font-extrabold tracking-[0.16em] text-black transition hover:-translate-y-0.5 hover:bg-cofiOliveHover hover:shadow-lg hover:shadow-cofiOlive/20 disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0">
                    <span id="connect-label">CONECTAR</span>
                    <svg id="connect-spinner" class="portal-spinner hidden h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle class="opacity-25" cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3"></circle>
                        <path class="opacity-90" d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
                    </svg>
                </button>
            </form>

            <section id="access-result" class="hidden mt-8 rounded-2xl border border-emerald-500/25 bg-emerald-500/5 p-5" aria-live="polite">
                <div class="flex items-center gap-3 text-emerald-400">
                    <span class="flex h-8 w-8 items-center justify-center rounded-full bg-emerald-500/15 text-base">✅</span>
                    <h2 class="font-outfit text-xl font-bold">Acceso concedido</h2>
                </div>
                <dl class="mt-5 space-y-3 border-t border-emerald-500/15 pt-4 text-sm">
                    <div class="flex items-center justify-between gap-4">
                        <dt class="text-zinc-400">Plan</dt>
                        <dd id="result-plan" class="font-semibold text-white"></dd>
                    </div>
                    <div class="flex items-center justify-between gap-4">
                        <dt class="text-zinc-400">Tiempo disponible</dt>
                        <dd id="result-minutes" class="font-semibold text-white"></dd>
                    </div>
                    <div class="flex items-center justify-between gap-4">
                        <dt class="text-zinc-400">Expira</dt>
                        <dd id="result-expires-at" class="text-right font-semibold text-white"></dd>
                    </div>
                </dl>
            </section>
        </section>
    </main>

    <div id="toast-region" class="pointer-events-none fixed inset-x-4 top-4 z-50 mx-auto flex max-w-md flex-col gap-3" aria-live="polite" aria-atomic="true"></div>
    <script src="js/portal.js"></script>
</body>
</html>
