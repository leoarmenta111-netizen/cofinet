# ---------------------------------------------------------------
# HTTP  → redirect everything to HTTPS (except ACME challenges)
# ---------------------------------------------------------------
server {
    listen 80;
    server_name cofinet-portal.duckdns.org;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------
# HTTPS → main server block
# ---------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name cofinet-portal.duckdns.org;

    # ----- SSL certificates (managed by certbot) -----
    ssl_certificate     /etc/letsencrypt/live/cofinet-portal.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cofinet-portal.duckdns.org/privkey.pem;

    # ----- SSL hardening (managed by certbot) -----
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ----- Security headers -----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ----- Frontend static files -----
    root /usr/share/nginx/html;
    index index.html;

    # ----- API reverse proxy -----
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Timeouts for long webhook processing
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }

    # ----- Admin panel -----
    location = /admin {
        return 301 /admin/login.html;
    }

    location /admin/ {
        alias /usr/share/nginx/admin/;
        index login.html;
    }

    # ----- SPA fallback -----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
