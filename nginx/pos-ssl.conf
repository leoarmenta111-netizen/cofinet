server {
    listen 443 ssl;
    server_name cofinet-portal.duckdns.org;

    ssl_certificate
        /etc/letsencrypt/live/cofinet-portal.duckdns.org/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/cofinet-portal.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;


    # -----------------------------------------------------
    # POS PRODUCT IMAGES
    # -----------------------------------------------------

    location /media/pos-products/ {
        alias /usr/share/nginx/pos-product-images/;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # -----------------------------------------------------
    # POS
    # -----------------------------------------------------

    location = /pos {
        return 301 /pos/;
    }

    location /pos/ {
        alias /usr/share/nginx/pos/;
        index index.html;

        try_files $uri $uri/ /pos/index.html;
    }

    # -----------------------------------------------------
    # POS API / existing backend
    # -----------------------------------------------------

    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------
    # ADMIN
    # -----------------------------------------------------

    location = /admin {
        return 301 /admin/login.html;
    }

    location /admin/ {
        alias /usr/share/nginx/admin/;
        index login.html;
    }

    # IMPORTANT:
    # Do not expose/redirect the captive portal through HTTPS.
    location / {
        return 404;
    }
}
