# Authentication rate limiting.
# Empty map keys are not accounted by limit_req, so other routes are unaffected.
map $uri $admin_login_limit_key {
    default "";
    "/api/admin/login" $binary_remote_addr;
}

map $uri $staff_unlock_limit_key {
    default "";
    "/api/pos/staff/unlock" $binary_remote_addr;
}

limit_req_zone $admin_login_limit_key zone=admin_login:10m rate=5r/m;
limit_req_zone $staff_unlock_limit_key zone=staff_unlock:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    limit_req zone=admin_login burst=5 nodelay;
    limit_req zone=staff_unlock burst=15 nodelay;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /media/pos-products/ {
        alias /usr/share/nginx/pos-product-images/;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # -----------------------------------------------------
    # CUSTOMER SELF-ORDER
    # -----------------------------------------------------

    location = /customer-order {
        return 301 /customer-order/;
    }

    location /customer-order/ {
        root /usr/share/nginx;
        index index.html;

        try_files $uri $uri/ /customer-order/index.html;

        add_header Cache-Control "no-store";
    }

    location = /pos {
        return 301 /pos/;
    }

    location /pos/ {
        alias /usr/share/nginx/pos/;
        index index.html;
    }

    location = /admin {
        return 301 /admin/login.html;
    }

    location /admin/ {
        alias /usr/share/nginx/admin/;
        index login.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
